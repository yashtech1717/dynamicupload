{% extends "base.html" %}

{% block content %}
<style>
    .neu-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 75vh;
        padding: 20px 15px;
        background: #ffffff;
    }

    .neu-card {
        width: 100%;
        max-width: 420px;
        padding: 45px 36px;
        border-radius: 30px;
        background: #ffffff;
        box-shadow: 12px 12px 24px #e2e8f0, -12px -12px 24px #ffffff;
        border: 1px solid #f1f5f9;
        transition: all 0.3s ease;
    }

    .neu-avatar-box {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 6px 6px 14px #e2e8f0, -6px -6px 14px #ffffff;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 38px;
        transition: all 0.3s ease;
        border: 1px solid #f8fafc;
    }

    .neu-card:hover .neu-avatar-box {
        box-shadow: inset 4px 4px 8px #e2e8f0, inset -4px -4px 8px #ffffff;
        transform: scale(0.98);
    }

    .neu-header {
        text-align: center;
        margin-bottom: 32px;
    }

    .neu-title {
        color: #1e293b;
        font-size: 26px;
        font-weight: 800;
        margin: 0 0 6px 0;
        letter-spacing: -0.5px;
    }

    .neu-subtitle {
        color: #64748b;
        font-size: 14px;
        margin: 0;
    }

    .neu-input-group {
        position: relative;
        margin-bottom: 22px;
    }

    .neu-input-icon {
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 18px;
        color: #94a3b8;
        pointer-events: none;
        transition: color 0.2s ease;
    }

    .neu-input {
        width: 100%;
        padding: 16px 20px 16px 54px;
        border: 1px solid #f1f5f9;
        border-radius: 20px;
        background: #ffffff;
        box-shadow: inset 5px 5px 10px #e2e8f0, inset -5px -5px 10px #ffffff;
        font-family: inherit;
        font-size: 15px;
        color: #1e293b;
        outline: none;
        box-sizing: border-box;
        transition: all 0.25s ease;
    }

    .neu-input:focus {
        border-color: #4f7cff;
        box-shadow: inset 6px 6px 12px #cbd5e1, inset -6px -6px 12px #ffffff, 0 0 0 3px rgba(79, 124, 255, 0.15);
    }

    .neu-input:focus ~ .neu-input-icon {
        color: #4f7cff;
    }

    .neu-toggle-pwd {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        background: #ffffff;
        box-shadow: 3px 3px 6px #e2e8f0, -3px -3px 6px #ffffff;
        border: 1px solid #f1f5f9;
        cursor: pointer;
        font-size: 16px;
        padding: 8px;
        border-radius: 12px;
        color: #64748b;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .neu-toggle-pwd:active {
        box-shadow: inset 2px 2px 4px #e2e8f0, inset -2px -2px 4px #ffffff;
    }

    .neu-options-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 28px;
        padding: 0 4px;
    }

    .neu-checkbox-label {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        user-select: none;
        color: #475569;
        font-size: 14px;
        font-weight: 600;
    }

    .neu-checkbox-label input {
        width: 18px;
        height: 18px;
        accent-color: #4f7cff;
        cursor: pointer;
    }

    .neu-submit-btn {
        width: 100%;
        padding: 18px 24px;
        border: none;
        border-radius: 22px;
        background: linear-gradient(135deg, #4f7cff 0%, #6c5ce7 100%);
        color: #ffffff;
        font-family: inherit;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 6px 6px 14px #e2e8f0, -6px -6px 14px #ffffff, 0 6px 20px rgba(79, 124, 255, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    .neu-submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 8px 8px 18px #e2e8f0, -8px -8px 18px #ffffff, 0 10px 25px rgba(79, 124, 255, 0.45);
    }

    .neu-submit-btn:active {
        transform: translateY(1px);
        box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.2);
    }

    .neu-btn-arrow {
        transition: transform 0.2s ease;
    }

    .neu-submit-btn:hover .neu-btn-arrow {
        transform: translateX(4px);
    }
</style>

<div class="neu-wrapper">
    <div class="neu-card">
        {% set site_set = get_site_settings() %}
        {% if site_set.intro_video_enabled and site_set.intro_video_url %}
        <!-- Pre-Login Intro Video Card -->
        <div style="margin-bottom: 25px; text-align: center;">
            <div style="padding: 10px; border-radius: 22px; background: #ffffff; box-shadow: inset 4px 4px 10px #e2e8f0, inset -4px -4px 10px #ffffff; border: 1px solid #f1f5f9;">
                <video controls autoplay muted playsinline webkit-playsinline loop style="width: 100%; max-height: 240px; border-radius: 16px; object-fit: cover; background: #000; display: block;">
                    <source src="{{ get_media_url(site_set.intro_video_url, 'video') }}" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
            <div style="font-size: 12px; color: #64748b; font-weight: 700; margin-top: 8px;">
                🎬 Intro Video
            </div>
        </div>
        {% endif %}

        <!-- Neumorphic Header -->
        <div class="neu-header">
            <div class="neu-avatar-box">🌟</div>
            <h2 class="neu-title">Welcome Back</h2>
            <p class="neu-subtitle">Sign in to your private portal</p>
        </div>

        <!-- Neumorphic Form -->
        <form method="post" action="{{ url_for('login') }}">
            <!-- Username Field -->
            <div class="neu-input-group">
                <input type="text" 
                       id="usernameInput" 
                       name="username" 
                       required 
                       placeholder="Username" 
                       class="neu-input" 
                       autocomplete="username">
                <span class="neu-input-icon">👤</span>
            </div>

            <!-- Password Field -->
            <div class="neu-input-group">
                <input type="password" 
                       id="passwordInput" 
                       name="password" 
                       required 
                       placeholder="Password" 
                       class="neu-input" 
                       autocomplete="current-password">
                <span class="neu-input-icon">🔒</span>
                <button type="button" class="neu-toggle-pwd" onclick="togglePasswordVisibility()" title="Toggle password visibility">
                    👁️
                </button>
            </div>

            <!-- Options Row -->
            <div class="neu-options-row">
                <label class="neu-checkbox-label">
                    <input type="checkbox" name="remember" id="remember">
                    <span>Keep me logged in</span>
                </label>
            </div>

            <!-- Neumorphic Submit Button -->
            <button type="submit" class="neu-submit-btn" id="loginBtn">
                <span>Sign In</span>
                <span class="neu-btn-arrow">→</span>
            </button>
        </form>
    </div>
</div>

<script>
function togglePasswordVisibility() {
    const pwdInput = document.getElementById('passwordInput');
    const toggleBtn = event.currentTarget;
    if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        toggleBtn.textContent = '🙈';
    } else {
        pwdInput.type = 'password';
        toggleBtn.textContent = '👁️';
    }
}

document.addEventListener('DOMContentLoaded', function() {
    const uInput = document.getElementById('usernameInput');
    if (uInput) uInput.focus();

    const form = document.querySelector('form');
    if (form) {
        form.addEventListener('submit', function() {
            const btn = document.getElementById('loginBtn');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<span>Signing In...</span> <span class="neu-btn-arrow">⏳</span>';
            }
        });
    }
});
</script>
{% endblock %}
